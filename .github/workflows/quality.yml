name: API quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://openbank:openbank@127.0.0.1:5432/openbank
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 604800
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: openbank
          POSTGRES_USER: openbank
          POSTGRES_PASSWORD: openbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbank -d openbank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Static checks and unit tests
        run: npm run quality
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run PostgreSQL integration tests
        run: npm run test:e2e
      - name: Build production image
        run: docker build --tag openbank-api:${{ github.sha }} .
